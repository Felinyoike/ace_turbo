<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <rect width="400" height="220" fill="#0d0d0f"/>
  <!-- Subtle crosshair -->
  <line x1="0" y1="110" x2="400" y2="110" stroke="#1a1a1d" stroke-width="0.5" stroke-dasharray="4 8"/>
  <line x1="200" y1="0" x2="200" y2="220" stroke="#1a1a1d" stroke-width="0.5" stroke-dasharray="4 8"/>
  <!-- Outer shroud -->
  <circle cx="200" cy="110" r="96" fill="#121214" stroke="#2c2c30" stroke-width="1.5"/>
  <!-- Outer ring -->
  <circle cx="200" cy="110" r="88" fill="none" stroke="#d7dee5" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="200" cy="110" r="46" fill="#0d0d0f" stroke="#d7dee5" stroke-width="2.5"/>
  <!-- 12 vanes using rotate + translate + rotate for angled blade effect -->
  <g transform="translate(200,110)">
    <g transform="rotate(0)">  <g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(30)"> <g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(60)"> <g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(90)"> <g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(120)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(150)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(180)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(210)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(240)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(270)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(300)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
    <g transform="rotate(330)"><g transform="translate(67,0) rotate(-28)"><rect x="-20" y="-4" width="40" height="8" rx="2" fill="#c8c6c5"/></g></g>
  </g>
  <!-- Pivot dots on outer ring (12 pivot points) -->
  <g transform="translate(200,110)">
    <g transform="rotate(0)">  <circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(30)"> <circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(60)"> <circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(90)"> <circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(120)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(150)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(180)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(210)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(240)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(270)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(300)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
    <g transform="rotate(330)"><circle cx="88" cy="0" r="3.5" fill="#ff571a"/></g>
  </g>
  <!-- Centre detail -->
  <circle cx="200" cy="110" r="14" fill="#1e1e22" stroke="#929090" stroke-width="1.5"/>
  <circle cx="200" cy="110" r="5"  fill="#ff571a" opacity="0.8"/>
  <!-- Corner label tag -->
  <rect x="0" y="0" width="3" height="40" fill="#ff571a"/>
</svg>
